<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Oii Chat 💬</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="login-screen">

        <div class="login-box">

            <h1>Oii Chat 💬</h1>

            <p>Welcome to Oii Chat</p>

            <button id="googleLoginBtn" type="button">
                🔵 Continue with Google
            </button>

            <p id="authMessage"></p>

        </div>

    </div>


    <!-- CHAT APP -->
    <div id="chatApp" style="display:none;">

        <!-- HEADER -->
        <header class="top-header">

            <div class="profile-area">

                <img
                    id="myProfile"
                    src="profile.png"
                    class="my-profile"
                    alt="Profile"
                >

                <div>
                    <h1>Oii Chat 💬</h1>
                    <span id="myStatus">Online</span>
                </div>

            </div>

        </header>


        <!-- MAIN -->
        <div class="chat-container">

            <!-- FRIENDS -->
            <div class="friends-section">

                <h2>👥 My Friends</h2>

                <button
                    id="findContactsBtn"
                    type="button"
                >
                    📱 Find Friends from Contacts
                </button>

                <p id="contactsMessage"></p>

                <div id="friendsList"></div>

            </div>


            <!-- WELCOME -->
            <div class="welcome-chat">

                <h2>Welcome to Oii Chat ❤️</h2>

                <p>Your chat app is ready.</p>

            </div>

        </div>

    </div>

</div>


<script type="module" src="./script.js"></script>

</body>
</html>
