<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oii Chat 💬</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="login-screen">

        <div class="login-box">

            <h1>Oii Chat 💬</h1>

            <p>Welcome to Oii Chat</p>

            <!-- PHONE NUMBER -->
            <input
                type="tel"
                id="phoneNumber"
                placeholder="Phone Number (+919876543210)"
            >

            <!-- SEND OTP -->
            <button onclick="sendOTP()">
                Send OTP
            </button>

            <!-- FIREBASE reCAPTCHA -->
            <div id="recaptcha-container"></div>

            <!-- OTP -->
            <input
                type="text"
                id="otpInput"
                placeholder="Enter 6-digit OTP"
                maxlength="6"
            >

            <!-- VERIFY -->
            <button onclick="verifyOTP()">
                Verify & Login
            </button>

            <!-- MESSAGE -->
            <p id="authMessage"></p>

        </div>

    </div>


    <!-- MAIN CHAT APP -->
    <div id="chatApp" style="display:none;">

        <!-- HEADER -->
        <header class="top-header">

            <div class="profile-area">

                <img
                    src="profile.png"
                    class="my-profile"
                    alt="Profile"
                >

                <div>
                    <h1>Oii Chat 💬</h1>
                    <span>Online</span>
                </div>

            </div>

        </header>


        <!-- CHAT AREA -->
        <div class="chat-container">

            <div class="welcome-chat">

                <h2>Welcome to Oii Chat ❤️</h2>

                <p>
                    Your chat app is ready.
                </p>

            </div>

        </div>
