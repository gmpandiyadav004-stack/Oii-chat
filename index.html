<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oii Chat 💬</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app">

        <!-- ========================================== -->
        <!-- LOGIN SCREEN -->
        <!-- ========================================== -->

        <div id="loginScreen" class="login-screen">
            <div class="login-box">
                
                <h1>Oii Chat 💬</h1>
                <p>Welcome to Oii Chat</p>

                <!-- Phone Number Input -->
                <input 
                    type="tel" 
                    id="phoneNumber" 
                    placeholder="Phone Number (eg. +919876543210)"
                >

                <!-- Send OTP Button -->
                <button onclick="sendOTP()">
                    Send OTP
                </button>

                <!-- reCAPTCHA Container (Firebase தேவைப்படுவது) -->
                <div id="recaptcha-container" style="margin: 15px 0;"></div>

                <!-- OTP Input -->
                <input 
                    type="text" 
                    id="otpInput" 
                    placeholder="Enter 6-digit OTP"
                >

                <!-- Verify OTP & Login Button -->
                <button onclick="verifyOTP()">
                    Verify & Login
                </button>

                <!-- Auth Status / Error Messages -->
                <p id="authMessage" style="margin-top: 15px; font-weight: bold;"></p>

            </div>
        </div>

        <!-- ========================================== -->
        <!-- MAIN OII CHAT APP (Hidden initially) -->
        <!-- ========================================== -->

        <div id="chatApp" style="display: none;">
            
            <!-- TOP HEADER -->
            <header class="top-header">
                <div class="profile-area">
                    <img 
                        src="profile.png" 
                        class="my-profile" 
                        alt="Profile"
                    >
                    <div>
                        <h1>Oii Chat 💬</h1>
                        <span>Online</span>
                    </div>
                </div>
            </header>

            <!-- Chat Area Placeholder -->
            <div class="chat-container" style="padding: 20px;">
                <p>Chat screen coming soon...</p>
            </div>

        </div>

    </div>

    <!-- JavaScript Link (Module type) -->
    <script type="module" src="script.js"></script>

</body>
</html>
