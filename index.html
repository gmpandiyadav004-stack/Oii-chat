<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Oii Chat 💬</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<div class="app">


    <!-- ======================================
         LOGIN SCREEN
    ======================================= -->

    <div
        id="loginScreen"
        class="login-screen"
    >

        <div class="login-box">

            <h1>Oii Chat 💬</h1>

            <p>
                Welcome to Oii Chat
            </p>


            <button
                id="googleLoginBtn"
                type="button"
            >
                🔵 Continue with Google
            </button>


            <p id="authMessage"></p>

        </div>

    </div>



    <!-- ======================================
         MAIN OII CHAT
    ======================================= -->

    <div
        id="chatApp"
        class="chat-app"
        style="display:none;"
    >


        <!-- ==================================
             HEADER
        =================================== -->

        <header class="top-header">


            <div class="header-left">

                <button
                    id="profileOpenBtn"
                    class="profile-button"
                    type="button"
                >

                    <img
                        id="myProfile"
                        src="profile.png"
                        class="my-profile"
                        alt="Profile"
                    >

                </button>


                <div>

                    <h1>
                        Oii Chat
                    </h1>

                    <span id="myStatus">
                        Online
                    </span>

                </div>

            </div>


            <div class="header-actions">

                <button
                    type="button"
                    class="header-btn"
                    title="Search"
                >
                    🔍
                </button>
